# Site Settings
name: Echo Play
title: Echo Play | Εργοθεραπεία
description: Το Echoplay είναι ένας ιστότοπος όπου βρισκόμαστε για να παίξουμε, να συζητήσουμε και να διασκεδάσουμε! Από τη Νικολέττα Χαλδαιοπούλου.
tags:
  - blog
  - παιχνίδι
  - γονείς
  - εργοθεραπεία
  - απόψεις
show_hero: false
hero: /assets/img/echoplay-hero.jpg
hero_slogan: "Read | See | Try"
menu:
  - title: Αρχική
    url: /
  - title: Σχετικά
    url: /about
  - title: Δράσεις
    url: /actions
  - title: Γκαλερί
    url: /gallery
  - title: Υπηρεσίες
    url: /services
  - title: Βιβλιοπροτάσεις
    url: /book-suggestions
  - title: Επικοινωνία
    url: /contact
  - title: Blog
    url: /blog
email: n.chaldeopoulou@gmail.com
# See: https://disqus.com/
# disqus_username: disqus_username
# Contact Form Setting
# See: https://formspree.io/
# formspree_form_id: formspree_form_id


# Social Media Settings
# Remove the item if you don't need it
# github_username: github_username
# facebook_username: 
# twitter_username: twitter_username
instagram_username: chaldeopoulou
linkedin_username: nikoletta-chaldeopoulou-4016a6241
# medium_username: medium_username


# Posts Settings
show_time_bar: true
show_modal_on_exit: false
show_modal_on_finish_post: true
two_columns_layout: true


# Advanced Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://echoplay.gr" # the base hostname & protocol for your site
google_analytics: "UA-XXXXXXXX-X"
language: "gr"
categories_folder: category
sent_message_url: "/contact/message-sent/"


# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
collections:
  authors:
    output: true
paginate_path: "/page/:num/"
show_get_theme_btn: true
use_logo: false

# Content paginator
paginate_content:
  enabled: true
  debug: false
  collections:
    - posts
  auto: false
  separator: "--page-break--"
  permalink: "/:num/"
  seo_canonical: true
  properties:
    part:
      is_generated: true
    last:
      is_generated: true
    single:
      is_generated: true

# SASS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-paginate-content

# Exclude my node related stuff
exclude: [
  'docs/',
  'vendor/',
  'LICENSE',
  'CHANGELOG.md',
  'jekflix.gemspec',
  'package.json',
  'package-lock.json',
  'src',
  'node_modules',
  'initpost.sh',
  'Gemfile',
  'Gemfile.lock',
  'gulpfile.js',
  'README.md'
]

# Theme
version: v3.1.2
